name: DEV bypass Windows numeric tests
on:
  pull_request:
    branches: [razvoj-offset-arx]
    paths:
      - 'geometry/bypass/**'
      - 'tests/*bypass*'
      - '.github/workflows/dev-bypass-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-msvc:
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        toolset: [v141,v142]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install existing v141 development toolchain
        if: matrix.toolset == 'v141'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build-logs | Out-Null
          $vsPath = Join-Path $env:RUNNER_TEMP 'vs2017-buildtools'
          $installer = Join-Path $env:RUNNER_TEMP 'vs2017-buildtools.exe'
          Invoke-WebRequest 'https://aka.ms/vs/15/release/vs_buildtools.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'Build Tools installer does not have a valid Microsoft signature.' }
          $installArgs = @('--quiet', '--wait', '--norestart', '--nocache', '--installPath', "`"$vsPath`"", '--add', 'Microsoft.VisualStudio.Workload.VCTools', '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64', '--add', 'Microsoft.VisualStudio.Component.VC.ATLMFC')
          $installProcess = Start-Process $installer -ArgumentList $installArgs -PassThru
          if (!$installProcess.WaitForExit(900000)) { $installProcess.Kill(); throw 'VS 2017 installation timed out.' }
          "Installer exit code: $($installProcess.ExitCode)" | Out-File build-logs/v141-installation.txt
          if ($installProcess.ExitCode -notin @(0, 3010)) {
            Get-ChildItem $env:TEMP -Filter 'dd_*' -File | Copy-Item -Destination build-logs -ErrorAction SilentlyContinue
            throw 'Unable to install v141 build tools and MFC/ATL.'
          }
          $msbuildPath = Join-Path $vsPath 'MSBuild/15.0/Bin/MSBuild.exe'
          if (!(Test-Path $msbuildPath)) { throw 'VS 2017 MSBuild was not installed.' }
          "TVS_MSBUILD=$msbuildPath" >> $env:GITHUB_ENV
          "TVS_VS2017=$vsPath" >> $env:GITHUB_ENV
      - name: Install existing v142 development toolchain
        if: matrix.toolset == 'v142'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build-logs | Out-Null
          $vsPath = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          $installer = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe'
          $installArgs = @('modify', '--installPath', "`"$vsPath`"", '--add', 'Microsoft.VisualStudio.Component.VC.14.29.16.11.MFC', '--add', 'Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL', '--quiet', '--norestart', '--nocache')
          $installProcess = Start-Process $installer -ArgumentList $installArgs -PassThru
          if (!$installProcess.WaitForExit(600000)) { $installProcess.Kill(); throw 'MFC installation timed out.' }
          "Installer exit code: $($installProcess.ExitCode)" | Out-File build-logs/mfc-installation.txt
          if ($installProcess.ExitCode -notin @(0, 3010)) {
            Get-ChildItem $env:TEMP -Filter 'dd_*' -File | Copy-Item -Destination build-logs -ErrorAction SilentlyContinue
            throw 'Unable to install the v142 MFC/ATL components.'
          }
      - name: Run isolated numerical tests (no ARX or DBX build)
        env:
          TVS_BYPASS_TOOLSET: ${{ matrix.toolset }}
        run: |
          New-Item -ItemType Directory -Force bypass-windows-results | Out-Null
          python tests/run_bypass_msvc.py 2>&1 | Tee-Object bypass-windows-results/tests.txt
          if ($LASTEXITCODE -ne 0) { throw "Isolated MSVC tests failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bypass-windows-${{ matrix.toolset }}
          path: |
            bypass-windows-results/
            build-logs/
